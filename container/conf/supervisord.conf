[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/snipe-cf/supervisord.pid

[unix_http_server]
file=/run/snipe-cf/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/snipe-cf/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:mariadb]
command=/usr/bin/mariadbd --user=mysql
priority=10
stdout_logfile=/run/snipe-cf/mariadb.log
stdout_logfile_maxbytes=1MB
redirect_stderr=true

; started by the entrypoint once the database is restored
[program:httpd]
command=/usr/sbin/httpd -DFOREGROUND
environment=APACHE_LOG_DIR="/var/log/apache2"
autostart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=/usr/bin/php artisan schedule:work
directory=/var/www/html
user=apache
autostart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:shipper]
command=/bin/sh -c "while sleep ${BINLOG_SHIP_INTERVAL:-30}; do /opt/snipeit-cf/db.sh ship; done"
autostart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:checkpointer]
command=/bin/sh -c "while sleep ${CHECKPOINT_INTERVAL:-1800}; do /opt/snipeit-cf/db.sh checkpoint; done"
autostart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
