ServerName localhost
# TLS terminates at Cloudflare; without this Laravel builds http:// URLs and rejects the setup page
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
LoadModule remoteip_module modules/mod_remoteip.so
RemoteIPHeader CF-Connecting-IP

# half a vCPU cannot use more workers than this; the default 250 could exhaust memory instead
<IfModule mpm_prefork_module>
	StartServers 2
	MinSpareServers 2
	MaxSpareServers 4
	MaxRequestWorkers 16
</IfModule>

# let browsers keep images and built assets instead of re-fetching them through PHP and R2
<LocationMatch "^/(storage-proxy|uploads)/">
	Header set Cache-Control "private, max-age=3600"
</LocationMatch>
<LocationMatch "^/(css|js)/">
	Header set Cache-Control "public, max-age=86400"
</LocationMatch>
